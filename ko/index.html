<style>
/*
 * 版面：顶栏两格（名字 | 操作）+ 左画布右侧栏，格子之间用细线分隔（同 icons 的线框）；
 * 配色同 icons：不用彩色强调，强调色就是正文色，选中态用一层很淡的正文色；控件尺度沿用 my-home。
 */
:root {
  --bg: #fbfbfc;
  --surface: #ffffff;
  --surface-2: #fafafb;
  --hover: #f1f1f3;
  --canvas: #f6f6f7;
  --grid: #e9e9ec;
  --border: #e6e6ea;
  --border-strong: #d4d4da;
  --text: #0e0e11;
  --text-muted: #6e6f78;
  --text-faint: #a2a3ab;
  --text-inverse: #ffffff;
  --accent: var(--text);
  --accent-hover: #2a2a30;
  --accent-weak: color-mix(in srgb, var(--text) 9%, transparent);
  --accent-ring: color-mix(in srgb, var(--text) 18%, transparent);
  --radius-sm: 6px;
  --radius: 8px;
  --shadow-sm: 0 1px 2px rgba(32, 38, 34, 0.05);
  --shadow: 0 4px 14px rgba(32, 38, 34, 0.07);
  --font-sans: 'Nunito', system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', sans-serif;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-base: 14px;
  --fs-md: 15px;
  --control-h: 32px;
  --side: 320px;
  --top-h: 57px;
}
:root[data-lang='zh'] { --font-sans: 'Nunito', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei UI', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif; }
:root[data-lang='ja'] { --font-sans: 'Nunito', 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', 'Meiryo', sans-serif; }
:root[data-lang='ko'] { --font-sans: 'Nunito', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #09090b; --surface: #0e0e11; --surface-2: #0c0c0e; --hover: #18181c; --canvas: #121215; --grid: #1b1b20;
    --border: #1d1d22; --border-strong: #2a2a31; --text: #f2f2f4; --text-muted: #9a9ba4; --text-faint: #5e5f68;
    --text-inverse: #0e0e11; --accent: var(--text); --accent-hover: #d6d6da;
    --accent-weak: color-mix(in srgb, var(--text) 10%, transparent); --accent-ring: color-mix(in srgb, var(--text) 22%, transparent);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow: 0 4px 14px rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #09090b; --surface: #0e0e11; --surface-2: #0c0c0e; --hover: #18181c; --canvas: #121215; --grid: #1b1b20;
    --border: #1d1d22; --border-strong: #2a2a31; --text: #f2f2f4; --text-muted: #9a9ba4; --text-faint: #5e5f68;
    --text-inverse: #0e0e11; --accent: var(--text); --accent-hover: #d6d6da;
    --accent-weak: color-mix(in srgb, var(--text) 10%, transparent); --accent-ring: color-mix(in srgb, var(--text) 22%, transparent);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow: 0 4px 14px rgba(0, 0, 0, 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
/* 一屏的应用：整页不滚，侧栏（窄屏时是内容区）自己滚 */
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0;
  background: var(--bg); color: var(--text); font: var(--fs-base)/1.5 var(--font-sans);
  -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
}
.num { font-variant-numeric: tabular-nums; }
svg { flex: none; display: block; }

/* ---------- 按钮（同 my-home） ---------- */
button, .btn {
  font: inherit; font-size: var(--fs-sm); color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm); height: var(--control-h); padding: 0 12px;
  cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1;
  user-select: none; transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}
button:hover, .btn:hover { background: var(--hover); border-color: var(--border-strong); }
button:active, .btn:active { transform: translateY(0.5px); filter: brightness(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--text-inverse); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn input { display: none; }
button svg, .btn svg { color: var(--text-muted); }
/* 图标 + 文字的控件：文字框裁到大写字母高度和基线再居中，中日韩字和拉丁字母都和图标对齐（不支持的浏览器照旧） */
button > span, .btn > span, .status a > span, .check > span { text-box: trim-both cap alphabetic; }
/* 中日韩字的墨迹整体比大写字母高半个像素到一个像素：再往下挪一点做视觉居中 */
:root:is([data-lang='zh'], [data-lang='ja'], [data-lang='ko']) :is(button, .btn, .check) > span { translate: 0 0.06em; }
.btn.primary svg { color: inherit; }
:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }
.btn:focus-within { outline: 2px solid var(--accent-ring); outline-offset: 1px; }
input[type='checkbox'], input[type='range'] { accent-color: var(--accent); }
::selection { background: var(--accent-weak); }

/* 分段控件（同 icons 的视图切换：选中是一层下沉底 + 内描边） */
.seg { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: var(--radius); background: var(--hover); }
.seg button { height: 28px; border: 0; background: none; color: var(--text-muted); padding: 0 10px; }
.seg button:hover { background: none; color: var(--text); }
.seg button[aria-pressed='true'] { color: var(--text); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong), var(--shadow-sm); }
.seg button[aria-pressed='true'] svg { color: var(--text); }

/* ---------- 顶栏 ---------- */
.top {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--side); align-items: stretch;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.actions {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: var(--top-h);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
.samples { display: flex; gap: 4px; }
.samples button { width: 30px; height: 30px; padding: 0; overflow: hidden; }
.samples img { display: block; width: 100%; height: 100%; object-fit: cover; }
.samples button[aria-pressed='true'] { box-shadow: 0 0 0 2px var(--accent); }
.actions .sep { width: 1px; height: 20px; background: var(--border); }
.brand {
  display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--border);
  padding-block: 12px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  font-weight: 700; font-size: var(--fs-md); letter-spacing: -.01em; white-space: nowrap;
}
.brand svg { color: var(--accent); }
.actions .lang {
  margin-left: auto; height: var(--control-h); padding: 0 6px; font: inherit; font-size: var(--fs-xs); font-weight: 400; color: var(--text-muted);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
}
.actions .lang:hover { border-color: var(--border-strong); color: var(--text); }
/* 裁掉行盒留白后字形会超出内容框，overflow: hidden 会把上下切掉：上下补回一点内边距再用负外边距抵掉 */
.brand > span[data-t] { overflow: hidden; text-overflow: ellipsis; text-box: trim-both cap alphabetic; padding-block: 0.3em; margin-block: -0.3em; }
:root:is([data-lang='zh'], [data-lang='ja'], [data-lang='ko']) .brand > span[data-t] { translate: 0 0.06em; }

/* ---------- 主体 ---------- */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--side); }
.stage {
  position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab;
  /* 底纹沿用 my-home 平面图画布：浅色细网格 */
  background-color: var(--canvas);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.stage.panning { cursor: grabbing; }
.stage.drag::after {
  content: attr(data-drop); position: absolute; inset: 12px; display: grid; place-items: center;
  border: 2px dashed var(--accent); border-radius: var(--radius); background: color-mix(in srgb, var(--accent-weak) 70%, transparent);
  color: var(--accent); font-weight: 600; pointer-events: none;
}
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
/* 计算 / 载入中：顶部居中的浮标（转圈 + 进度），旧结果调暗表示已过时；超过 150 ms 才出现，快的调整不闪 */
.busy {
  position: absolute; top: 12px; left: 50%; z-index: 1; translate: -50% 0; overflow: hidden;
  display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow-sm);
  font-size: var(--fs-xs); color: var(--text-muted); pointer-events: none;
}
.busy[hidden] { display: none; }
.busy #busyPct { min-width: 3ch; text-align: right; color: var(--text); }
.busy #busyPct:empty { display: none; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { rotate: 1turn; } }
.busy-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; }
.busy-bar i { position: absolute; inset: 0; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform .2s ease; }
.stage canvas { transition: opacity .2s ease; }
.stage.is-busy canvas { opacity: .6; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
/* 缩放比例浮标（同 my-home 画布右下角的缩放条） */
.zoom {
  position: absolute; right: 12px; bottom: 12px; z-index: 1; display: flex; align-items: center; gap: 2px; padding: 2px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.zoom button { height: 26px; min-width: 26px; padding: 0 8px; border: 0; background: none; font-variant-numeric: tabular-nums; }
.zoom button:hover { background: var(--hover); }
.zoom output { min-width: 48px; text-align: center; font-size: var(--fs-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; }
.status a { color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.status a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.status .links { display: flex; flex-wrap: wrap; gap: 4px 14px; }

aside {
  min-width: 0; overflow-y: auto; background: var(--surface-2); border-left: 1px solid var(--border);
  scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
}
.group { display: grid; gap: 14px; padding-block: 16px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--border); }
.label { margin: 0; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .06em; color: var(--text-muted); }
/*
 * 滑块（照 llr 的 SliderRow）：透明的原生 range 负责键盘、焦点与无障碍，上面手绘一条发丝轨道、
 * 从原点到当前值的填充、默认值处的小刻度和一个圆盘滑块。hover 时轨道变粗、圆盘放大；按住时描边换主色、
 * 外加一圈柔光。--range-p 是注册属性：双击复位、滚轮、输入数字这类跳变会滑过去，拖动时关掉过渡贴着指针。
 */
@property --range-p { syntax: '<number>'; inherits: true; initial-value: 0; }

.slider.is-modified .slider-head label { color: var(--text); font-weight: 600; }
.slider-extra { font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.slider-number {

  font: inherit; font-size: var(--fs-xs); font-variant-numeric: tabular-nums; color: var(--text-muted);
  background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm);
  appearance: textfield; -moz-appearance: textfield; transition: color .12s, border-color .12s, background-color .12s;
}
.slider-number::-webkit-outer-spin-button, .slider-number::-webkit-inner-spin-button { appearance: none; margin: 0; }
.slider.is-modified .slider-number { color: var(--text); }
.slider-number:hover { border-color: var(--border); background: var(--surface); color: var(--text); }
.slider-number:focus { outline: none; border-color: var(--accent); background: var(--surface); color: var(--text); }
.range-wrap {
  --knob: 14px; --rail-h: 2px;
  position: relative; display: block; height: 18px;
  transition: --range-p 280ms cubic-bezier(0.22, 1, 0.36, 1);
}
.range-wrap.is-dragging { transition: none; }
.range-wrap:hover, .range-wrap.is-dragging { --rail-h: 4px; }
.range-rail, .range-fill {
  position: absolute; top: 50%; height: var(--rail-h); border-radius: 999px; transform: translateY(-50%);
  pointer-events: none; transition: height 180ms cubic-bezier(0.22, 1, 0.36, 1);
}
.range-rail { left: calc(var(--knob) / 2); right: calc(var(--knob) / 2); background: var(--border-strong); }
.range-fill {
  --range-a: min(var(--range-p), var(--range-o));
  --range-b: max(var(--range-p), var(--range-o));
  left: calc(var(--knob) / 2 + var(--range-a) * (100% - var(--knob)));
  width: calc((var(--range-b) - var(--range-a)) * (100% - var(--knob)));
  background: var(--accent);
}
.range-mark {
  position: absolute; top: 50%; left: calc(var(--knob) / 2 + var(--range-r) * (100% - var(--knob)));
  width: 1px; height: 9px; transform: translate(-50%, -50%); background: var(--text-faint); pointer-events: none;
}
.range-thumb {
  position: absolute; top: 50%; left: calc(var(--knob) / 2 + var(--range-p) * (100% - var(--knob)));
  width: var(--knob); height: var(--knob); border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--border-strong); box-shadow: var(--shadow-sm), 0 1px 3px rgba(32, 38, 34, 0.12);

}
.range-wrap:hover .range-thumb { transform: translate(-50%, -50%) scale(1.15); border-color: var(--text-faint); }
.range-wrap:focus-within .range-thumb { border-color: var(--accent); border-width: 2px; }
.range-wrap.is-dragging .range-thumb {

.range-input::-webkit-slider-thumb { appearance: none; width: var(--knob); height: var(--knob); }

// ---------- 基础算子 ----------
function boxesForGauss(sigma) {
  const wIdeal = Math.sqrt((12 * sigma * sigma) / 3 + 1)
  let wl = Math.floor(wIdeal); if (wl % 2 === 0) wl--
  const wu = wl + 2
  const m = Math.round((12 * sigma * sigma - 3 * wl * wl - 12 * wl - 9) / (-4 * wl - 4))

  const inv = 1 / (2 * r + 1)

  const inv = 1 / (2 * r + 1)

    for (let y = 0; y < H; y++) {
      acc += s[Math.min(H - 1, y + r) * W + x] - s[Math.max(0, y - r - 1) * W + x]

    for (let i = 0; i < N; i++) gc[i] = Math.min(1, Math.max(0, (P.wp - Vs[i]) / span))
  }
  const v = { level, a, gc, lifted }
  cache.tone = { k: kk, v }

}
function stageCover(P, toneSt) { // 各档套上网点浓度，渐变处按明暗混合
  const kk = cache.tone.k + '|' + key(P, ['light', 'dark'])
  if (cache.cover?.k === kk) return cache.cover.v
  const { level, a, gc, lifted } = toneSt, tones = [0, P.light, P.dark, 1], cover = new Float32Array(N)
  for (let i = 0; i < N; i++) {
    const c = tones[level[i]]
    // 抬上来的像素直接给深网点：它们落在实黑里，渐变用的明度图在那里无效
    cover[i] = lifted[i] ? P.dark : a ? c * (1 - a[i]) + gc[i] * a[i] : c

  const kk = [cache.ink.k, cache.tone.k, pen ? cache.pen.k : '-', edges ? cache.edges.k : '-', P.whiteLines].join('#')

  const black = new Float32Array(N), white = new Float32Array(N)

async function stagePrint(P, masks, cover) {  // 网点在出图分辨率上印

  const spotAt = makeSpot(P.screen, PW * S, PH * S, a / n2 / S, b / n2 / S, Math.sqrt(n2) * S), lut = thresholds(P.screen)

  const sample = (m, fx, fy) => {

    const x1 = Math.min(W - 1, x0 + 1), y1 = Math.min(H - 1, y0 + 1), tx = Math.min(1, Math.max(0, fx - x0)), ty = Math.min(1, Math.max(0, fy - y0))
    const top = m[y0 * W + x0] * (1 - tx) + m[y0 * W + x1] * tx, bot = m[y1 * W + x0] * (1 - tx) + m[y1 * W + x1] * tx

    const fy = (y + 0.5) * inv - 0.5
    for (let x = 0; x < PW; x++, o++) {
      const fx = (x + 0.5) * inv - 0.5
      if (R === 1 ? white[o] : sample(white, fx, fy) > 0.5) continue
      if (R === 1 ? black[o] : sample(black, fx, fy) > 0.5) { page[o] = 1; continue }
      const c = R === 1 ? cover[o] : sample(cover, fx, fy)
      if (c >= 0.999) { page[o] = 1; continue }
      if (c <= 0.001) continue
      const thr = lut[Math.round(AREA[Math.round(c * 256)] * 256)]
      let hit = 0
      for (let sy = 0; sy < S; sy++) for (let sx = 0; sx < S; sx++) if (spotAt(x * S + sx, y * S + sy) > thr) hit++

}

let pending = null, busy = false, gen = 0
// 让出执行权：主线程发来的新参数 / 新图片能插进来；有新的就放弃手上这张（已算完的阶段留在缓存里）
const ABORT = Symbol('abort'), chan = new MessageChannel()
let wake = null
chan.port1.onmessage = () => wake?.()
let jobGen = 0, jobId = 0
const report = (p) => postMessage({ id: jobId, progress: p })
async function checkpoint() {
  await new Promise((r) => { wake = r; chan.port2.postMessage(0) })
  if (pending || gen !== jobGen) throw ABORT
}
onmessage = (e) => {
  const m = e.data
  if (m.type === 'image') {
    gen++

    gray = m.gray; Lraw = m.L; Vhk = m.V
    for (const kk of Object.keys(cache)) delete cache[kk]

  }

  if (!busy) run()
}
async function run() {
  busy = true
  while (pending) {
    const { P, id } = pending; pending = null
    jobGen = gen; jobId = id
    const t0 = performance.now()
    try {
      const L = stageLevels(P); report(0.05); await checkpoint()
      const inkSt = stageInk(P, L); report(0.25); await checkpoint()
      const pen = P.pen ? stagePen(P) : null; report(0.3); await checkpoint()
      const edges = P.edgeLines ? stageEdges(P) : null; report(0.35); await checkpoint()
      const toneSt = stageTone(P, inkSt); report(0.55); await checkpoint()
      const masks = stageMasks(P, inkSt, toneSt, pen, edges), cover = stageCover(P, toneSt); report(0.6); await checkpoint()
      const { page, R } = await stagePrint(P, masks, cover)
      postMessage({ id, page, R, ms: performance.now() - t0, pitch: lattice(P) }, [page.buffer])
    } catch (err) {
      if (err !== ABORT) throw err
    }
  }
  busy = false
}

const LANG_PATH = /\/(zh|ja|ko)\/?(index\.html)?$/

}

let imgAuto = {}
function autoParams(gray, L, V) {
  const D = DEFAULTS, n = gray.length, step = Math.max(1, Math.floor(n / 200000))
  let sat = 0, cnt = 0
  for (let i = 0; i < n; i += step, cnt++) if (V[i] - L[i] > 10) sat++
  const satFrac = sat / cnt
  const hk = satFrac < 0.04 ? 0 : Math.min(1.2, Math.round((0.4 + 2 * satFrac) * 20) / 20)

  const g = new Float32Array(cnt)
  for (let i = 0, j = 0; i < n && j < cnt; i += step, j++) {

  let m = cnt; while (m > 0 && g[m - 1] >= 0.96) m--

  const ip = D.wp ** D.gamma, is = D.bp ** D.gamma

// vs = 每个图像像素占几个 CSS 像素，(vx, vy) = 图像左上角在画布里的位置（CSS 像素）。
// 二值网点交给浏览器缩放会出摩尔纹，所以自己画：放大（≥ 1 物理像素 / 图像像素）用最近邻，网点边缘锐利；
// 缩小时从对半缩小的金字塔里挑一级，按缩放比例轻微模糊后再缩，网点呈现为平滑的灰
let vs = 1, vx = 0, vy = 0, autoFit = true, mips = []
const zoomLabel = document.getElementById('zoomLabel')
function buildMips() {

  while (cur.width > 64 && cur.height > 64) {
    const c = document.createElement('canvas')
    c.width = Math.max(1, Math.round(cur.width / 2)); c.height = Math.max(1, Math.round(cur.height / 2))
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'
    g.drawImage(cur, 0, 0, c.width, c.height)

  }

  return Math.min((stage.clientWidth - 2 * pad) / full.width, (stage.clientHeight - 2 * pad) / full.height)
}

  vs = Math.max(1e-3, fitScale())
  vx = (stage.clientWidth - full.width * vs) / 2; vy = (stage.clientHeight - full.height * vs) / 2
  autoFit = true
}

  const dpr = window.devicePixelRatio || 1
  ns = Math.min(Math.max(ns, Math.min(fitScale(), 1 / dpr) * 0.5), 32 / dpr)
  vx = cx - ((cx - vx) * ns) / vs; vy = cy - ((cy - vy) * ns) / vs; vs = ns
  autoFit = false

  const bw = Math.round(cw * dpr), bh = Math.round(ch * dpr)
  if (out.width !== bw || out.height !== bh) { out.width = bw; out.height = bh }
  const k = vs * dpr

  const x = vx * dpr, y = vy * dpr, w = full.width * k, h = full.height * k
  const cs = getComputedStyle(document.documentElement)
  view.filter = 'none'
  view.fillStyle = cs.getPropertyValue('--border').trim()
  view.fillRect(Math.round(x) - 1, Math.round(y) - 1, Math.round(w) + 2, Math.round(h) + 2)
  if (k >= 1) {
    view.imageSmoothingEnabled = false
    view.drawImage(full, x, y, w, h)
  } else {
    let lv = 0
    while (lv + 1 < mips.length && mips[lv + 1].width >= full.width * k) lv++
    const src = mips[lv], shrink = src.width / (full.width * k)
    view.imageSmoothingEnabled = true; view.imageSmoothingQuality = 'high'
    view.filter = shrink > 1.05 ? `blur(${(0.45 * shrink).toFixed(2)}px)` : 'none'
    view.drawImage(src, x, y, w, h)
    view.filter = 'none'
  }
  zoomLabel.textContent = `${Math.round(k * 100)}%`
}
new ResizeObserver(() => present()).observe(stage)

// 滚轮缩放（以指针为中心）
stage.addEventListener('wheel', (e) => {
  e.preventDefault()
  const r = stage.getBoundingClientRect()
  zoomAt(vs * Math.pow(1.0015, -e.deltaY * (e.deltaMode === 1 ? 16 : 1)), e.clientX - r.left, e.clientY - r.top)
}, { passive: false })
// 拖动平移；两指捏合缩放
{
  const pts = new Map()
  let last = null
  // 拖过就不弹右键菜单；没拖的右键点按保留浏览器菜单（能另存图片）
  let downAt = null, dragged = false
  const mid = () => { const a = [...pts.values()]; return a.length > 1 ? { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) } : { x: a[0].x, y: a[0].y, d: 0 } }
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.zoom')) return
    e.preventDefault()
    stage.setPointerCapture(e.pointerId)
    const r = stage.getBoundingClientRect()
    pts.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top })
    if (pts.size === 1) (downAt = { x: e.clientX, y: e.clientY }), (dragged = false)
    last = mid(); stage.classList.add('panning')
  })
  stage.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return
    const r = stage.getBoundingClientRect()
    pts.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top })
    if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 4) dragged = true
    const m = mid()
    vx += m.x - last.x; vy += m.y - last.y; autoFit = false
    if (pts.size > 1 && last.d > 0 && m.d > 0) return (zoomAt(vs * (m.d / last.d), m.x, m.y), (last = m))
    last = m
    present()
  })
  const up = (e) => { pts.delete(e.pointerId); last = pts.size ? mid() : null; if (!pts.size) stage.classList.remove('panning') }
  stage.addEventListener('pointerup', up)
  stage.addEventListener('pointercancel', up)
  stage.addEventListener('contextmenu', (e) => { if (dragged) e.preventDefault() })
}
const oneToOne = (cx = stage.clientWidth / 2, cy = stage.clientHeight / 2) => zoomAt(1 / (window.devicePixelRatio || 1), cx, cy)
stage.addEventListener('dblclick', (e) => {
  if (e.target.closest('.zoom')) return
  const r = stage.getBoundingClientRect()
  if (autoFit) oneToOne(e.clientX - r.left, e.clientY - r.top)
  else { fitView(); present() }
})
document.getElementById('zoomIn').addEventListener('click', () => zoomAt(vs * 1.25, stage.clientWidth / 2, stage.clientHeight / 2))
document.getElementById('zoomOut').addEventListener('click', () => zoomAt(vs / 1.25, stage.clientWidth / 2, stage.clientHeight / 2))
document.getElementById('zoomFit').addEventListener('click', () => { fitView(); present() })
document.getElementById('zoom1').addEventListener('click', () => oneToOne())
window.addEventListener('keydown', (e) => {
  if (e.target.closest?.('input, textarea')) return
  if (e.key === '0') { fitView(); present() }
  else if (e.key === '1') oneToOne()
})

// ---------- 滑块（照 llr 的 SliderRow） ----------
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v))
const decimals = (x) => (String(x).split('.')[1] || '').length
const rows = new Map()
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)) } catch {} paintPresets() }

function buildRow(sp) {
  const scale = sp.scale ?? 1
  const row = document.createElement('div')
  row.className = 'slider'
  row.innerHTML = `
    <div class="slider-head">
      <label for="${sp.k}"${sp.note ? ` title="${t(sp.note)}"` : ''}>${t(sp.label)}${sp.unit ? ` <span class="slider-extra">${sp.unit}</span>` : ''}</label>
      <span class="slider-extra" data-extra></span>
      <input class="slider-number" type="number" aria-label="${t(sp.label)}" min="${sp.min * scale}" max="${sp.max * scale}" step="${+(sp.step * scale).toFixed(6)}">
    </div>
    <span class="range-wrap">
      <span class="range-rail"></span><span class="range-fill"></span><span class="range-mark"></span><span class="range-thumb"></span>
      <input id="${sp.k}" class="range-input" type="range" min="${sp.min}" max="${sp.max}" step="${sp.step}" title="${t('点选后可滚轮微调（Shift ×10）· 双击复位')}">
    </span>
`
  const wrap = row.querySelector('.range-wrap')
  const range = row.querySelector('.range-input')
  const num = row.querySelector('.slider-number')
  const frac = (v) => clamp((v - sp.min) / (sp.max - sp.min), 0, 1)
  wrap.style.setProperty('--range-o', sp.min < 0 && sp.max > 0 ? frac(0) : 0)
  // 默认值落在两端时不画刻度：空的填充已经说明了
  const d = DEFAULTS[sp.k], mark = row.querySelector('.range-mark')
  if (d > sp.min && d < sp.max) wrap.style.setProperty('--range-r', frac(d))
  else mark.hidden = true
  // 固定小数位（0.20 而不是 0.2），一列数字才对得齐
  const fmt = (v) => (v * scale).toFixed(decimals(+(sp.step * scale).toFixed(6)))
  const paint = () => {
    const v = P[sp.k]
    wrap.style.setProperty('--range-p', frac(v))
    if (document.activeElement !== num) num.value = fmt(v)
    range.value = v
    row.classList.toggle('is-modified', v !== DEFAULTS[sp.k])
    if (sp.extra) row.querySelector('[data-extra]').textContent = sp.extra(v)
  }
  const set = (v) => {
    v = clamp(+v.toFixed(decimals(sp.step)), sp.min, sp.max)
    if (v === P[sp.k]) return paint()
    P[sp.k] = v
    paint(); save()
    // 改尺寸要在主线程重新取样（大图要几百毫秒）：拖动中不做，停下 150 ms 后再做
    if (src && sp.k === 'size') return (clearTimeout(prepTimer), (prepTimer = setTimeout(() => (prepare(), compute()), 150)))
    schedule()
  }
  range.addEventListener('input', () => set(range.valueAsNumber))
  range.addEventListener('dblclick', () => set(DEFAULTS[sp.k]))
  // 拖动时关掉 --range-p 的过渡，圆盘贴着指针走
  range.addEventListener('pointerdown', () => {
    range.focus()
    wrap.classList.add('is-dragging')
    const end = () => { wrap.classList.remove('is-dragging'); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end) }
    window.addEventListener('pointerup', end)
    window.addEventListener('pointercancel', end)
  })
  // 数字框：输入中途不夹值（会吃掉「1」→「12」），提交时再夹到范围内
  const commit = () => { const raw = num.valueAsNumber; if (Number.isFinite(raw)) set(raw / scale); num.value = fmt(P[sp.k]) }
  num.addEventListener('change', commit)
  num.addEventListener('blur', commit)
  num.addEventListener('keydown', (e) => { if (e.key === 'Enter') num.blur() })
  rows.set(sp.k, paint)
  return row
}
function rebuildRows() {
  for (const el of document.querySelectorAll('.rows')) el.replaceChildren()
  rows.clear()
  for (const sp of SPEC) document.querySelector(`.rows[data-group="${sp.g}"]`).append(buildRow(sp))
  for (const paint of rows.values()) paint()
}
rebuildRows()

// 滚轮微调（同 llr）：只有点选的滑块响应，且每个滚动手势只判定一次归属
{
  const panel = document.getElementById('panel')
  let gestureEnd = 0, owner = null
  panel.addEventListener('wheel', (e) => {
    const input = e.target.closest?.('.range-input') ?? null
    const selected = !!input && document.activeElement === input
    if (e.timeStamp > gestureEnd) owner = selected ? input : null
    gestureEnd = e.timeStamp + 200
    if (!owner || owner !== input) return
    e.preventDefault()
    const step = Number(owner.step) || 1
    const next = clamp(Number(owner.value) + (e.deltaY < 0 ? 1 : -1) * step * (e.shiftKey ? 10 : 1), Number(owner.min), Number(owner.max))
    owner.value = String(+next.toFixed(decimals(step)))
    owner.dispatchEvent(new Event('input', { bubbles: true }))
  }, { passive: false })
}

function syncUI() {
  for (const paint of rows.values()) paint()
  for (const id of ['pen', 'whiteLines', 'darkSplit', 'edgeLines']) document.getElementById(id).checked = P[id]
  for (const el of document.querySelectorAll('[data-when]')) el.hidden = !P[el.dataset.when]
  for (const b of document.querySelectorAll('[data-screen]')) b.setAttribute('aria-pressed', String(b.dataset.screen === P.screen))
}
for (const id of ['pen', 'whiteLines', 'darkSplit', 'edgeLines']) {
  document.getElementById(id).addEventListener('change', (e) => { P[id] = e.target.checked; syncUI(); save(); schedule() })
}
for (const b of document.querySelectorAll('[data-screen]')) {
  b.addEventListener('click', () => { P.screen = b.dataset.screen; syncUI(); save(); schedule() })
}
// 预设：在这张图的自动值上改几个参数（不动处理尺寸）。当前参数正好等于某个预设时高亮它；换图时沿用这个预设
const PRESETS = [
  ['自动', {}],
  ['细网点', { lines: 320, light: 0.14, dark: 0.36 }],
  ['粗网点', { lines: 110, light: 0.2, dark: 0.46 }],
  ['高对比', { bp: 0.38, solid: 0.28, light: 0.22, dark: 0.52, grad: 0.5 }],
  ['柔和', { bp: 0.2, solid: 0.16, light: 0.12, dark: 0.32, minRegion: 300 }],
  ['线稿为主', { wp: 0.6, mid: 0.4, light: 0.1, dark: 0.3, grad: 0, fine: 3 }],
  ['线网', { screen: 'line', lines: 150, light: 0.2, dark: 0.45 }],
  ['风景', { edgeLow: 0.9, minRegion: 1200 }],
]
const presetBox = document.getElementById('presets')
const presetOf = (o) => ({ ...DEFAULTS, ...imgAuto, ...o, size: P.size })
const presetMatch = () => PRESETS.findIndex(([, o]) => { const want = presetOf(o); return Object.keys(want).every((key) => P[key] === want[key]) })
var presetsReady = false // save() 在预设建好之前也可能被调用（var 提升，不会撞上 const 的暂时性死区）
function paintPresets() {
  if (!presetsReady) return
  const m = presetMatch()
  for (const [i, b] of [...presetBox.children].entries()) b.setAttribute('aria-pressed', String(i === m))
}
function buildPresets() {
  presetBox.replaceChildren(...PRESETS.map(([name, o]) => {
    const b = document.createElement('button')
    b.type = 'button'; b.textContent = t(name)
    b.addEventListener('click', () => { P = presetOf(o); syncUI(); save(); schedule() })
    return b
  }))
  presetsReady = true
  paintPresets()
}
buildPresets()
document.getElementById('reset').addEventListener('click', () => {
  const size = P.size
  P = { ...presetOf({}), size: DEFAULTS.size }
  syncUI(); save()
  if (size !== P.size && src) prepare()
  schedule()
})
document.getElementById('copy').addEventListener('click', async (e) => {
  const label = e.currentTarget.querySelector('span')
  try { await navigator.clipboard.writeText(JSON.stringify(P, null, 2)); label.textContent = t('已复制') }
  catch { label.textContent = t('复制失败') }
  setTimeout(() => (label.textContent = t('复制参数')), 1400)
})
const hold = document.getElementById('hold')
const setOrig = (v) => { showOriginal = v; hold.setAttribute('aria-pressed', String(v)); draw() }
hold.addEventListener('pointerdown', () => setOrig(true))
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) hold.addEventListener(ev, () => showOriginal && setOrig(false))
hold.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setOrig(true) } })
hold.addEventListener('keyup', () => setOrig(false))
// ---------- 载入图片：文件、拖放、粘贴 ----------
async function loadBlob(blob, name, sampleIdx = -1) {
  let bmp
  setBusy('载入中…')
  try { bmp = await createImageBitmap(blob) } catch { clearBusy(); hint.textContent = t('这个文件读不出来，换一张 PNG / JPG / WebP 试试'); return }
  // 换图时沿用当前预设（套上新图的自动值）；手调过的参数原样保留
  const keep = presetMatch()
  src = bmp; srcName = name || t('粘贴的图片')
  prepare(true)
  if (keep >= 0) { P = presetOf(PRESETS[keep][1]); syncUI(); save() }
  for (const [i, b] of [...samplesBox.children].entries()) b.setAttribute('aria-pressed', String(i === sampleIdx))
  compute()
}
// 示例图：路径跟着 favicon 走（语言子目录里的入口页要往上一级）
const SAMPLES = ['demo-1', 'demo-2']
const assetUrl = (path) => new URL(path, document.querySelector('link[rel="icon"]').href).href
const samplesBox = document.getElementById('samples')
samplesBox.replaceChildren(...SAMPLES.map((name, i) => {
  const b = document.createElement('button')
  b.type = 'button'; b.title = `${t('示例')} ${i + 1}`; b.setAttribute('aria-pressed', 'false')
  b.innerHTML = `<img src="${assetUrl(`samples/${name}-thumb.webp`)}" alt="">`
  b.addEventListener('click', () => loadSample(i))
  return b
}))
async function loadSample(i) {
  setBusy('载入中…')
  try {
    const r = await fetch(assetUrl(`samples/${SAMPLES[i]}.webp`))
    if (!r.ok) throw new Error(r.status)
    await loadBlob(await r.blob(), `${t('示例')} ${i + 1}`, i)
  } catch { clearBusy(); hint.textContent = t('打开或拖入一张图片') }
}
document.getElementById('file').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) loadBlob(f, f.name) })
stage.addEventListener('dragstart', (e) => e.preventDefault())
stage.addEventListener('dragover', (e) => { if (!e.dataTransfer.types.includes('Files')) return; e.preventDefault(); stage.classList.add('drag') })
stage.addEventListener('dragleave', () => stage.classList.remove('drag'))
stage.addEventListener('drop', (e) => {
  e.preventDefault(); stage.classList.remove('drag')
  const f = [...e.dataTransfer.files].find((x) => x.type.startsWith('image/'))
  if (f) loadBlob(f, f.name)
})
window.addEventListener('paste', (e) => {
  const it = [...(e.clipboardData?.items || [])].find((x) => x.type.startsWith('image/'))
  if (it) loadBlob(it.getAsFile(), t('粘贴的图片'))
})

// ---------- 网点卡片预览：30% 浓度、固定小间距，颜色跟主题 ----------
const TAU = 2 * Math.PI
const PCELL = {
  dot: (u, v) => (Math.cos(TAU * u) + Math.cos(TAU * v)) / 2,
  square: (u, v) => 1 - 2 * Math.max(Math.abs(u - Math.floor(u) - 0.5), Math.abs(v - Math.floor(v) - 0.5)),
  diamond: (u, v) => 1 - Math.abs(u - Math.floor(u) - 0.5) - Math.abs(v - Math.floor(v) - 0.5),
  chain: (u, v) => 0.68 * Math.cos(TAU * u) + 0.32 * Math.cos(TAU * v),
  line: (u) => Math.cos(TAU * u),
  cross: (u, v) => Math.max(Math.cos(TAU * u), Math.cos(TAU * v)),
  wave: (u, v) => Math.cos(TAU * (u + 0.2 * Math.sin((TAU * v) / 2.5))),
}
function previewSpot(type, w, h, per) {
  const cell = PCELL[type], c = 1 / per / Math.SQRT2
  if (cell) return (x, y) => cell((x + y) * c, (y - x) * c)
  if (type === 'ring') return (x, y) => Math.cos((TAU * Math.hypot(x - w / 2, y - h / 2)) / per)
  if (type === 'burst') return (x, y) => Math.cos(28 * Math.atan2(y - h / 2, x - w / 2))
  const g = Math.max(1, Math.round(per / 4))
  return (x, y) => { const t = 52.9829189 * ((0.06711056 * Math.floor(x / g) + 0.00583715 * Math.floor(y / g)) % 1); return 1 - (t - Math.floor(t)) }
}
function drawPreviews() {
  const cs = getComputedStyle(document.documentElement)
  const ink = cs.getPropertyValue('--text').trim(), paper = cs.getPropertyValue('--surface').trim()
  const dpr = window.devicePixelRatio || 1
  for (const b of document.querySelectorAll('[data-screen]')) {
    const c = b.querySelector('canvas'), type = b.dataset.screen
    const w = Math.round((c.clientWidth || 50) * dpr), h = Math.round(34 * dpr)
    c.width = w; c.height = h
    const g = c.getContext('2d'), spot = previewSpot(type, w, h, 5 * dpr)
    // 阈值：按这块预览自己的取值分布取 30% 分位
    const vals = new Float32Array(w * h)
    for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i++) vals[i] = spot(x, y)
    const thr = Float32Array.from(vals).sort()[Math.floor(0.7 * (vals.length - 1))]
    g.fillStyle = paper; g.fillRect(0, 0, w, h); g.fillStyle = ink
    for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i++) if (vals[i] > thr) g.fillRect(x, y, 1, 1)
  }
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawPreviews)


applyLang()
syncUI()
drawPreviews()
loadSample(0)
</script>
