[project]
name = "manga-filter"
version = "0.1.0"
description = "彩色插画转黑白漫画网点，纯机械运算，不用学习模型"
readme = "README.md"
authors = [
    { name = "Jianqi Pan", email = "jannchie@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
manga-filter = "manga_filter.cli:main"
